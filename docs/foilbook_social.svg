<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070a"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#05070a"/>
    </linearGradient>
    <linearGradient id="bubble" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>

  <!-- Main Container -->
  <rect x="80" y="50" width="1040" height="575" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1"/>

  <!-- Left Sidebar (Conversations) -->
  <rect x="80" y="50" width="320" height="575" fill="#020617" opacity="0.8"/>
  <line x1="400" y1="50" x2="400" y2="625" stroke="#1e293b" stroke-width="1"/>

  <text x="110" y="95" font-family="'Orbitron', sans-serif" font-weight="900" font-size="18" fill="#a855f7">💬 Direct Messenger</text>
  
  <!-- Conversation 1 Active -->
  <rect x="95" y="120" width="290" height="70" rx="12" fill="#1e1b4b" stroke="#818cf8" stroke-width="1"/>
  <circle cx="130" cy="155" r="20" fill="#38bdf8"/>
  <text x="165" y="150" font-family="sans-serif" font-weight="700" font-size="14" fill="#ffffff">VaultTrader_CA</text>
  <text x="165" y="168" font-family="sans-serif" font-size="12" fill="#94a3b8">Hey! Send over the serial...</text>

  <!-- Conversation 2 -->
  <rect x="95" y="200" width="290" height="70" rx="12" fill="#0f172a"/>
  <circle cx="130" cy="235" r="20" fill="#f43f5e"/>
  <text x="165" y="230" font-family="sans-serif" font-weight="700" font-size="14" fill="#cbd5e1">Ash Ketchum</text>
  <text x="165" y="248" font-family="sans-serif" font-size="12" fill="#64748b">Thanks for the Charizard trade!</text>

  <!-- Chat Main Header -->
  <rect x="401" y="50" width="718" height="60" fill="#0f172a"/>
  <line x1="400" y1="110" x2="1120" y2="110" stroke="#1e293b" stroke-width="1"/>
  <circle cx="440" cy="80" r="16" fill="#38bdf8"/>
  <text x="470" y="85" font-family="sans-serif" font-weight="700" font-size="16" fill="#ffffff">VaultTrader_CA <tspan font-size="11" fill="#10b981">• Active now</tspan></text>

  <!-- Message Bubbles -->
  <!-- Left Message -->
  <rect x="430" y="150" width="360" height="70" rx="16" fill="#1e293b"/>
  <text x="450" y="180" font-family="sans-serif" font-size="13" fill="#e2e8f0">Hey Alex! Interested in trading your Charizard</text>
  <text x="450" y="200" font-family="sans-serif" font-size="13" fill="#e2e8f0">VCA Gem Mint 10 for my Pikachu 151 + cash?</text>

  <!-- Right Message (Mine) -->
  <rect x="710" y="240" width="370" height="80" rx="16" fill="url(#bubble)"/>
  <text x="730" y="270" font-family="sans-serif" font-size="13" fill="#ffffff">Hey! Send over the VCA serial number</text>
  <text x="730" y="290" font-family="sans-serif" font-size="13" fill="#ffffff">for your Pikachu so I can verify CMAC chip logs.</text>

  <!-- Slab Trade Embed in Chat -->
  <rect x="430" y="340" width="300" height="150" rx="12" fill="#020617" stroke="#06b6d4" stroke-width="1"/>
  <rect x="445" y="355" width="70" height="120" rx="6" fill="#0f172a" stroke="#22d3ee" stroke-width="1"/>
  <text x="530" y="380" font-family="'Orbitron', sans-serif" font-weight="700" font-size="14" fill="#22d3ee">EMBEDDED SLAB TRADE</text>
  <text x="530" y="405" font-family="monospace" font-size="12" fill="#ffffff">VCA-000-000-001</text>
  <text x="530" y="425" font-family="sans-serif" font-size="12" fill="#10b981">Verified CMAC Valid ✅</text>
  <rect x="530" y="440" width="120" height="28" rx="14" fill="#0284c7"/>
  <text x="590" y="458" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="11" fill="#ffffff">Accept Trade</text>

  <!-- Message Input Bar -->
  <rect x="430" y="545" width="650" height="48" rx="24" fill="#020617" stroke="#334155" stroke-width="1"/>
  <text x="460" y="574" font-family="sans-serif" font-size="14" fill="#64748b">Send trade proposal or message...</text>
</svg>
