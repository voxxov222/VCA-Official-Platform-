<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070a"/>
      <stop offset="50%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#05070a"/>
    </linearGradient>
    <linearGradient id="holo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="33%" stop-color="#c084fc"/>
      <stop offset="66%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>

  <!-- Grid lines -->
  <g stroke="#22d3ee" stroke-width="0.5" opacity="0.08">
    <path d="M0 75 h1200 M0 150 h1200 M0 225 h1200 M0 300 h1200 M0 375 h1200 M0 450 h1200 M0 525 h1200 M0 600 h1200" />
    <path d="M150 0 v675 M300 0 v675 M450 0 v675 M600 0 v675 M750 0 v675 M900 0 v675 M1050 0 v675" />
  </g>

  <!-- Top Bar -->
  <rect x="0" y="0" width="1200" height="48" fill="#0f172a" opacity="0.8"/>
  <text x="30" y="28" font-family="'Orbitron', sans-serif" font-weight="900" font-size="16" fill="#22d3ee" filter="url(#glow)">VCA VERIFIED CARD AUTHORITY</text>
  <rect x="920" y="10" width="120" height="28" rx="14" fill="#22d3ee" opacity="0.2"/>
  <text x="940" y="28" font-family="monospace" font-size="12" fill="#22d3ee">VSCAN AI</text>
  <rect x="1050" y="10" width="120" height="28" rx="14" fill="#10b981" opacity="0.2"/>
  <text x="1070" y="28" font-family="monospace" font-size="12" fill="#34d399">NFC TAP</text>

  <!-- Hero Headline -->
  <text x="600" y="130" text-anchor="middle" font-family="'Orbitron', sans-serif" font-weight="900" font-size="42" fill="#ffffff">The Future of Collectible Trust is <tspan fill="url(#holo)">Verified.</tspan></text>
  <text x="600" y="165" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#94a3b8">NTAG424 DNA Encrypted NFC Smart Slabs • Gemini 3.6 Multimodal Vision AI • Immutable Ledger</text>

  <!-- 3D Slab Representation -->
  <g transform="translate(450, 210)">
    <!-- Acrylic Slab Case -->
    <rect x="0" y="0" width="300" height="420" rx="16" fill="#020617" stroke="#22d3ee" stroke-width="2" opacity="0.9" filter="url(#glow)"/>
    
    <!-- Label Sticker Header -->
    <rect x="15" y="15" width="270" height="65" rx="8" fill="url(#holo)"/>
    <rect x="17" y="17" width="266" height="61" rx="6" fill="#05070a" opacity="0.9"/>
    
    <text x="35" y="48" font-family="'Orbitron', sans-serif" font-weight="900" font-size="22" fill="#ffffff">VCA</text>
    <text x="35" y="65" font-family="monospace" font-size="10" fill="#22d3ee">VCA-000-000-001</text>
    <text x="210" y="45" font-family="'Orbitron', sans-serif" font-weight="900" font-size="20" fill="#fbbf24">#10</text>
    <text x="200" y="60" font-family="monospace" font-size="9" fill="#fef08a">GEM MINT</text>

    <!-- Card Inset -->
    <rect x="25" y="95" width="250" height="305" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
    
    <!-- Pokemon Artwork Illustration -->
    <circle cx="150" cy="210" r="70" fill="#f59e0b" opacity="0.3" filter="url(#glow)"/>
    <text x="150" y="215" text-anchor="middle" font-family="'Orbitron', sans-serif" font-weight="900" font-size="28" fill="#fbbf24">⚡ PIKACHU</text>
    <text x="150" y="240" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#cbd5e1">151 Special Illustration Rare #173/165</text>
    
    <!-- Subgrade Pill -->
    <rect x="45" y="355" width="210" height="30" rx="6" fill="#0f172a" stroke="#22d3ee" stroke-width="1" opacity="0.9"/>
    <text x="150" y="375" text-anchor="middle" font-family="monospace" font-size="11" fill="#38bdf8">C:10  |  C:9.5  |  E:10  |  S:10</text>
  </g>

  <!-- Feature Cards Bottom -->
  <g transform="translate(80, 520)">
    <rect x="0" y="0" width="310" height="110" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="20" y="35" font-family="'Orbitron', sans-serif" font-weight="700" font-size="15" fill="#22d3ee">🛡️ Tamper-Evident Acrylic</text>
    <text x="20" y="65" font-family="sans-serif" font-size="12" fill="#94a3b8">Sonic-welded UV-blocking case with</text>
    <text x="20" y="85" font-family="sans-serif" font-size="12" fill="#94a3b8">micro-channel tamper seals.</text>
  </g>

  <g transform="translate(445, 520)">
    <rect x="0" y="0" width="310" height="110" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="20" y="35" font-family="'Orbitron', sans-serif" font-weight="700" font-size="15" fill="#10b981">🛈 NTAG424 DNA Encrypted</text>
    <text x="20" y="65" font-family="sans-serif" font-size="12" fill="#94a3b8">Dynamic SUN/CMAC signatures generated</text>
    <text x="20" y="85" font-family="sans-serif" font-size="12" fill="#94a3b8">on every smartphone NFC tap.</text>
  </g>

  <g transform="translate(810, 520)">
    <rect x="0" y="0" width="310" height="110" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="20" y="35" font-family="'Orbitron', sans-serif" font-weight="700" font-size="15" fill="#c084fc">💬 Foilbook Social Network</text>
    <text x="20" y="65" font-family="sans-serif" font-size="12" fill="#94a3b8">Pokémon Facebook clone with live</text>
    <text x="20" y="85" font-family="sans-serif" font-size="12" fill="#94a3b8">direct messaging and slab trades.</text>
  </g>
</svg>
