<text x="300" y="1275" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="17" fill="#91a8b8">OUTER SHELL • NFC • TAMPER EVIDENCE</text>

<g>
<rect x="575" y="300" width="528" height="315" rx="26" fill="url(#panel)" stroke="#4b6274" stroke-width="2"/><circle cx="695" cy="385" r="52" fill="#102532" stroke="#5adfff" stroke-width="3" filter="url(#glow)"/><path d="M670 385h50M695 360v50M666 356l-25-22M724 356l25-22M666 414l-25 22M724 414l25 22" stroke="#5adfff" stroke-width="4"/><text x="775" y="390" font-family="Orbitron,Arial,sans-serif" font-size="30" font-weight="900" fill="#f5f7fa">VScan AI:</text><text x="775" y="430" font-family="Orbitron,Arial,sans-serif" font-size="27" font-weight="900" fill="#f5f7fa">10-Point Precision Grading</text><text x="610" y="485" font-family="Inter,Arial,sans-serif" font-size="20" fill="#d5dde3">Multimodal AI analyzes</text><text x="610" y="516" font-family="Inter,Arial,sans-serif" font-size="20" fill="#d5dde3">centering, corners, edges,</text><text x="610" y="547" font-family="Inter,Arial,sans-serif" font-size="20" fill="#d5dde3">and surface for objective</text><text x="610" y="578" font-family="Inter,Arial,sans-serif" font-size="20" fill="#d5dde3">condition scoring.</text>
</g>
<g>
<rect x="575" y="650" width="528" height="315" rx="26" fill="url(#panel)" stroke="#4b6274" stroke-width="2"/><circle cx="695" cy="735" r="48" fill="#102532" stroke="#5adfff" stroke-width="3"/><rect x="672" y="712" width="46" height="46" rx="8" fill="none" stroke="#5adfff" stroke-width="4"/><path d="M660 735h-35M730 735h35M695 700v-25M695 770v25" stroke="#5adfff" stroke-width="4"/><text x="610" y="825" font-family="Orbitron,Arial,sans-serif" font-size="28" font-weight="900" fill="#f5f7fa">NTAG424 DNA</text><text x="610" y="860" font-family="Orbitron,Arial,sans-serif" font-size="25" font-weight="900" fill="#f5f7fa">Encrypted Smart Slabs</text><text x="610" y="900" font-family="Inter,Arial,sans-serif" font-size="19" fill="#d5dde3">Secure hardware can support</text><text x="610" y="930" font-family="Inter,Arial,sans-serif" font-size="19" fill="#d5dde3">stronger tap-to-verify authentication.</text></g>
<g>
<rect x="575" y="1000" width="528" height="315" rx="26" fill="url(#panel)" stroke="#4b6274" stroke-width="2"/><circle cx="695" cy="1085" r="49" fill="#102532" stroke="#5adfff" stroke-width="3"/><path d="M695 1050l25 40-25 42-25-42z" fill="none" stroke="#8ceaff" stroke-width="5"/><text x="610" y="1175" font-family="Orbitron,Arial,sans-serif" font-size="27" font-weight="900" fill="#f5f7fa">Active Anti-Tamper</text><text x="610" y="1210" font-family="Orbitron,Arial,sans-serif" font-size="25" font-weight="900" fill="#f5f7fa">Conductive Coil</text><text x="610" y="1250" font-family="Inter,Arial,sans-serif" font-size="19" fill="#d5dde3">Supported hardware can record</text><text x="610" y="1280" font-family="Inter,Arial,sans-serif" font-size="19" fill="#d5dde3">tamper evidence and state changes.</text></g>

<rect x="40" y="1370" width="1063" height="600" rx="26" fill="url(#panel)" stroke="#4b6274" stroke-width="2"/>
<text x="78" y="1445" font-family="Orbitron,Arial,sans-serif" font-size="34" font-weight="900" fill="#f5f7fa">Immutable Ledger &amp;</text><text x="78" y="1490" font-family="Orbitron,Arial,sans-serif" font-size="34" font-weight="900" fill="#f5f7fa">Market Dashboard</text><text x="78" y="1540" font-family="Inter,Arial,sans-serif" font-size="21" fill="#d5dde3">Tracks valuation observations and auditable ownership history.</text>
<rect x="650" y="1425" width="395" height="365" rx="22" fill="#071017" stroke="#6c8798" stroke-width="3"/><text x="680" y="1460" font-family="JetBrains Mono,monospace" font-size="12" fill="#91a8b8">MARKET INTELLIGENCE</text><path d="M685 1710L730 1665l35 18 45-88 42 54 54-118 45 82 40-55" fill="none" stroke="#22d3ee" stroke-width="5"/><path d="M685 1735H1015M685 1500v235" stroke="#4d6677"/><rect x="685" y="1760" width="330" height="1" fill="#22d3ee" opacity=".3"/><text x="680" y="1820" font-family="Orbitron,Arial,sans-serif" font-size="18" fill="#5adfff">AUTHENTIC • VERIFIED</text><circle cx="980" cy="1813" r="16" fill="#22d3ee" opacity=".25"/><path d="M971 1813l7 7 13-16" stroke="#22d3ee" stroke-width="4" fill="none"/>
<text x="78" y="1870" font-family="JetBrains Mono,monospace" font-size="15" fill="#6f899a" letter-spacing="3">TRUST • SECURITY • ACCURACY • AUDITABILITY</text>
<text x="1040" y="2012" text-anchor="end" font-family="JetBrains Mono,monospace" font-size="12" fill="#587084">VCA • VERIFIED CARD AUTHORITY</text>
