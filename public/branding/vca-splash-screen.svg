<text x="58" y="95" font-family="Orbitron,Arial,sans-serif" font-size="47" font-weight="900" fill="#22d3ee">VCA:</text><text x="180" y="95" font-family="Orbitron,Arial,sans-serif" font-size="43" font-weight="900" fill="#f4f7fa"> The Future of Collectible Trust</text>
<text x="571" y="210" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="34" fill="#f6f8fb">VCA provides a <tspan fill="#46d8ff">“One Tap, Total Trust”</tspan></text><text x="571" y="255" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="34" fill="#f6f8fb">solution for high-value collectibles.</text>

<rect x="40" y="300" width="510" height="1030" rx="24" fill="url(#panel)" stroke="#4b6274" stroke-width="2"/>
<text x="300" y="346" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="14" fill="#6f899a" letter-spacing="4">PHYSICAL TRUST ARCHITECTURE</text>
