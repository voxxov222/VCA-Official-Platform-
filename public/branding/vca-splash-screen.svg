<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1143 2048" role="img" aria-labelledby="title desc">
<title id="title">VCA: The Future of Collectible Trust</title>
<desc id="desc">VCA technology presentation showing VScan AI, NFC smart slabs, tamper evidence and an immutable verification ledger.</desc>
